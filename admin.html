<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BISC EcoBiz Summit I — Organizer Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-[#090D16] text-white min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    function CommandCenter() {
      const [isAuth, setIsAuth] = React.useState(false);
      const [key, setKey] = React.useState('');
      const [userRole, setUserRole] = React.useState('');

      const validKeys = {
        'BISC-EXEC-2027': 'Master General Secretary',
        'ECOBIZ2027': 'Executive Board',
        'FACULTY-2027': 'Faculty Advisor',
        'JUDGE-2027': 'Judge Panel'
      };

      const handleLogin = (e) => {
        e.preventDefault();
        const cleanKey = key.trim();
        if (validKeys[cleanKey]) {
          setUserRole(validKeys[cleanKey]);
          setIsAuth(true);
        } else {
          alert('Invalid Security Passkey');
        }
      };

      if (!isAuth) {
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-[#111827] border border-[#00F0FF]/30 p-8 rounded-2xl max-w-md w-full text-center shadow-2xl space-y-6">
              <div className="w-16 h-16 bg-[#00F0FF]/10 text-[#00F0FF] rounded-full flex items-center justify-center mx-auto text-2xl font-bold">🔒</div>
              <div>
                <h1 className="text-2xl font-bold text-[#00F0FF]">BISC EcoBiz Command Center</h1>
                <p className="text-slate-400 text-xs mt-1">Restricted Organizing Board Portal</p>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <input 
                  type="password" 
                  placeholder="Enter Security Passkey" 
                  value={key} 
                  onChange={(e) => setKey(e.target.value)}
                  className="w-full bg-[#090D16] border border-slate-700 rounded-xl px-4 py-3 text-center text-white focus:outline-none focus:border-[#00F0FF]"
                />
                <button type="submit" className="w-full bg-[#00F0FF] text-black font-semibold py-3 rounded-xl hover:bg-cyan-400 transition shadow-lg shadow-cyan-500/10">
                  Authenticate Workspace
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="p-8 max-w-6xl mx-auto space-y-6">
          <div className="flex justify-between items-center border-b border-slate-800 pb-4">
            <div>
              <h1 className="text-3xl font-bold text-[#00F0FF]">BISC EcoBiz Summit I — Executive Dashboard</h1>
              <p className="text-slate-400 text-sm">Role: {userRole} | Target: 150 Delegates</p>
            </div>
            <button onClick={() => setIsAuth(false)} className="px-4 py-2 border border-red-500/50 text-red-400 rounded-lg hover:bg-red-500/10">
              Lock Session
            </button>
          </div>
          <div className="bg-[#111827] border border-slate-800 p-6 rounded-xl">
            <h2 className="text-xl font-semibold text-white">System Active</h2>
            <p className="text-slate-300 text-sm mt-1">Command Center authenticated and connected.</p>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<CommandCenter />);
  </script>
</body>
</html>
